name: Validate static website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-26
        with:
          persist-credentials: false
      - name: Use the tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, verified 2026-09-26
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build public files
        run: npm run build
      - name: Verify public output
        run: npm run verify
      - name: Verify the factual recovery artifact
        run: node scripts/check-release-fallback.mjs

# This workflow has no deployment job, Pages permission, environment, upload,
# production credential, push trigger, or setting-changing step.
